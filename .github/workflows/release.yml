name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux

          - os: windows-latest
            platform: win

          - os: macos-latest
            platform: mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Verify package metadata
        run: node -e "const p = require('./package.json'); console.log('author:', p.author); console.log('linux maintainer:', p.build?.linux?.maintainer)"

      - name: Build Electron application
        run: npx electron-builder --${{ matrix.platform }} --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release/
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: okzVM ${{ github.ref_name }}

          body: |
            ## 🚀 okzVM ${{ github.ref_name }}

            The latest release of okzVM.

            ### Downloads

            Choose the archive for your platform below:

            - 🪟 Windows — `.exe`
            - 🐧 Linux — `.AppImage` or `.deb`
            - 🍎 macOS — `.dmg` or `.zip`

            ---

          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release/*.exe
            release/*.deb
            release/*.AppImage
            release/*.dmg
            release/*.zip